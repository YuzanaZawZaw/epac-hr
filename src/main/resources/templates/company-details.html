<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Company Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
  <div class="container">
    <a href="/">&larr; Back</a>
    <h2 th:text="${company.companyName}">Company Name</h2>
    <div class="mb-3">
      <strong>Code:</strong> <span th:text="${company.companyCode}">CODE</span>
      &nbsp; | &nbsp;
      <strong>Contact:</strong> <span th:text="${company.contactPerson}">Person</span> - <span th:text="${company.contactPersonPhone}">Phone</span>
    </div>

    <h4>Departments</h4>
    <table class="table table-sm table-bordered">
      <thead>
        <tr><th>#</th><th>Name</th><th>Code</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr th:each="dept,iterStat : ${departments}">
          <td th:text="${iterStat.count}">1</td>
          <td th:text="${dept.departmentName}">Dept Name</td>
          <td th:text="${dept.departmentCode}">D001</td>
          <td>
            <a th:href="@{'/companies/' + ${company.companyId} + '/departments/' + ${dept.departmentId} + '/edit'}" class="btn btn-sm btn-outline-primary">Edit</a>
            <form th:action="@{'/companies/' + ${company.companyId} + '/departments/' + ${dept.departmentId} + '/delete'}" method="post" style="display:inline" onsubmit="return confirm('Delete department?');">
              <button class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </td>
        </tr>
        <tr th:if="${departments.size()} == 0"><td colspan="4">No departments yet.</td></tr>
      </tbody>
    </table>

    <div class="card mt-4">
      <div class="card-body">
        <h5 class="card-title">Create Department for <span th:text="${company.companyName}">Company</span></h5>
        <form th:action="@{'/companies/' + ${company.companyId} + '/departments'}" th:object="${newDepartment}" method="post">
          <div class="mb-3">
            <label class="form-label">Department Name</label>
            <input class="form-control" type="text" th:field="*{departmentName}" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Department Code</label>
            <input class="form-control" type="text" th:field="*{departmentCode}" required />
          </div>
          <button class="btn btn-primary">Create</button>
        </form>
      </div>
    </div>

    <!-- Edit form appears when editDepartment present -->
    <div th:if="${editDepartment != null}" class="card mt-4">
      <div class="card-body">
        <h5 class="card-title">Edit Department</h5>
        <form th:action="@{'/companies/' + ${company.companyId} + '/departments/' + ${editDepartment.departmentId} + '/update'}" th:object="${editDepartment}" method="post">
          <div class="mb-3">
            <label class="form-label">Department Name</label>
            <input class="form-control" type="text" th:field="*{departmentName}" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Department Code</label>
            <input class="form-control" type="text" th:field="*{departmentCode}" required />
          </div>
          <button class="btn btn-primary">Update</button>
          <a th:href="@{'/companies/' + ${company.companyId}}" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>

  </div>
</body>
</html>
