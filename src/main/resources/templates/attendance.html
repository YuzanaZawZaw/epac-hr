<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Attendance Sheet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .hours { width: 90px; text-align: right; }
    .time-input { width: 110px; }
    .highlight { background: #fff3cd; }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <h4>Attendance Sheet</h4>
    <div class="row mb-2">
      <div class="col-md-4">
        Employee ID: <strong th:text="${employee.id}">A-002</strong><br/>
        Name: <strong th:text="${employee.name}">OLIVER ROBERT</strong>
      </div>
      <div class="col-md-4">
        Period from: <input type="date" id="periodFrom" th:value="${period.from}" class="form-control"/>
        Period to:   <input type="date" id="periodTo" th:value="${period.to}" class="form-control mt-1"/>
      </div>
      <div class="col-md-4 text-end">
        Position: <strong th:text="${employee.position}">General Labour</strong>
      </div>
    </div>

    <form id="attendanceForm" onsubmit="return false;">
      <table class="table table-bordered table-sm align-middle">
        <thead class="table-light">
          <tr>
            <th>Date</th>
            <th colspan="2">Morning</th>
            <th colspan="2">Afternoon</th>
            <th class="hours">Working Hours</th>
            <th class="hours">Overtime Hours</th>
            <th>Remarks</th>
          </tr>
          <tr>
            <th></th>
            <th>Time In</th><th>Time Out</th>
            <th>Time In</th><th>Time Out</th>
            <th></th><th></th><th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row,iterStat : ${rows}">
            <td th:text="${row.date}">2026-07-27</td>
            <td><input type="time" class="form-control form-control-sm time-input" th:value="${row.morningIn}" /></td>
            <td><input type="time" class="form-control form-control-sm time-input" th:value="${row.morningOut}" /></td>
            <td><input type="time" class="form-control form-control-sm time-input" th:value="${row.afternoonIn}" /></td>
            <td><input type="time" class="form-control form-control-sm time-input" th:value="${row.afternoonOut}" /></td>
            <td class="hours"><input type="text" readonly class="form-control form-control-sm hours wh" /></td>
            <td class="hours"><input type="text" readonly class="form-control form-control-sm hours ot" /></td>
            <td><input type="text" class="form-control form-control-sm remarks" th:value="${row.remarks}" /></td>
          </tr>
        </tbody>
      </table>

      <div class="d-flex justify-content-between">
        <div>
          <button class="btn btn-primary" id="saveBtn">Save</button>
          <button class="btn btn-secondary" id="exportCsv">Export CSV</button>
        </div>
        <div class="me-3">Total Working Hours: <strong id="totalWH">0.00</strong></div>
        <div>Overtime Total: <strong id="totalOT">0.00</strong></div>
      </div>
    </form>
  </div>

  <script>
    function parseTime(t) {
      if(!t) return null;
      const parts = t.split(':'); if(parts.length<2) return null;
      return parseInt(parts[0],10)*60 + parseInt(parts[1],10);
    }
    function minutesToHours(mins) { return (Math.round((mins/60)*100)/100).toFixed(2); }

    function computeRow(mIn, mOut, aIn, aOut, whEl, otEl) {
      let working = 0;
      const times = [mIn, mOut, aIn, aOut].map(parseTime);
      if(times[0]!=null && times[1]!=null && times[1] > times[0]) working += times[1]-times[0];
      if(times[2]!=null && times[3]!=null && times[3] > times[2]) working += times[3]-times[2];
      const overtime = Math.max(0, working - (8*60));
      whEl.value = minutesToHours(working);
      otEl.value = minutesToHours(overtime);
      return {working, overtime};
    }

    function recalcAll() {
      const tbody = document.querySelector('table tbody');
      let totalW = 0, totalO = 0;
      tbody.querySelectorAll('tr').forEach((tr, idx) => {
        const inputs = tr.querySelectorAll('input[type="time"]');
        const whEl = tr.querySelector('input.wh');
        const otEl = tr.querySelector('input.ot');
        const res = computeRow(inputs[0].value, inputs[1].value, inputs[2].value, inputs[3].value, whEl, otEl);
        totalW += res.working; totalO += res.overtime;
      });
      document.getElementById('totalWH').textContent = minutesToHours(totalW);
      document.getElementById('totalOT').textContent = minutesToHours(totalO);
    }

    document.addEventListener('input', function(e){ if(e.target.matches('input[type="time"]')) recalcAll(); });
    window.addEventListener('load', recalcAll);

    document.getElementById('saveBtn').addEventListener('click', async function(){
      const employeeId = document.querySelector('[th\:text="${employee.id}"]') ? document.querySelector('[th\:text="${employee.id}"]').textContent.trim() : 'A-002';
      const tbody = document.querySelector('table tbody');
      const rows = [];
      tbody.querySelectorAll('tr').forEach((tr) => {
        const date = tr.querySelector('td').textContent.trim();
        const times = tr.querySelectorAll('input[type="time"]');
        const wh = tr.querySelector('input.wh').value;
        const ot = tr.querySelector('input.ot').value;
        const remarks = tr.querySelector('input.remarks').value;
        rows.push({ employeeId, date, morningIn: times[0].value, morningOut: times[1].value, afternoonIn: times[2].value, afternoonOut: times[3].value, workingHours: wh, overtimeHours: ot, remarks });
      });

      try {
        const res = await fetch('/api/attendance', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(rows)
        });
        if(!res.ok) throw new Error('Save failed');
        const saved = await res.json();
        alert('Saved ' + saved.length + ' rows');
      } catch (err) { alert('Error saving: '+err.message); }
    });

    document.getElementById('exportCsv').addEventListener('click', function(){
      const tbody = document.querySelector('table tbody');
      const csv = ['Date,Morning Time In,Morning Time Out,Afternoon Time In,Afternoon Time Out,Working Hours,Overtime Hours,Remarks'];
      tbody.querySelectorAll('tr').forEach(tr => {
        const date = tr.querySelector('td').textContent.trim();
        const times = tr.querySelectorAll('input[type="time"]');
        const wh = tr.querySelector('input.wh').value;
        const ot = tr.querySelector('input.ot').value;
        const remarks = tr.querySelector('input.remarks').value.replace(/\n/g,' ');
        csv.push([date, times[0].value, times[1].value, times[2].value, times[3].value, wh, ot, '"'+remarks+'"'].join(','));
      });
      const blob = new Blob([csv.join('\n')], {type: 'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'attendance.csv'; a.click(); URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
